name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests (offline, no secrets)
        run: python -m pytest -q
      - name: Package builds and the demo runs from the wheel
        run: |
          pip install build
          python -m build
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl
          /tmp/w/bin/safepay --demo > /tmp/demo.txt
          grep -c "ALLOW\|BLOCK\|HOLD" /tmp/demo.txt
