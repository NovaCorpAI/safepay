name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests (offline, no secrets)
        run: python -m pytest -q
      - name: Package builds and the demo runs from the wheel
        run: |
          pip install build
          python -m build
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl
          /tmp/w/bin/safepay --demo > /tmp/demo.txt
          grep -c "ALLOW\|BLOCK\|HOLD" /tmp/demo.txt
