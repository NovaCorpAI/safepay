[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safepay"
version = "0.9.0"
description = "The payables firewall for AI agents: policy in plain words, live-web merchant check and intent reasoning before any PayPal or stablecoin (PYUSD, USDC) payment moves, a remote MCP connector any agent asks before it pays, human approvals (console, MCP, Telegram), a kill switch per agent, signed receipts and a hash-chained audit log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NovaCorp Labs" }]
keywords = ["ai-agents", "payments", "paypal", "guardrail", "agentic-commerce", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Flask is a core dependency on purpose: Vercel installs from pyproject.toml
# (not requirements.txt) when this file exists, and the hosted console needs it.
dependencies = [
    "requests>=2.33.0",
    "cryptography>=49.0.0",
    "openai>=1.40.0",
    "tavily-python>=0.5.0",
    "flask>=3.1.3",
    # The PayPal Agent Toolkit gate (safepay_create_order, the console's
    # agentic-commerce card). 1.1.0 is the light release (pydantic, httpx);
    # later releases pin langchain, crewai and openai-agents.
    "paypal-agent-toolkit==1.1.0",
]

[project.optional-dependencies]
web = ["gunicorn>=23.0.0"]
mcp = ["mcp>=1.2.0,<2"]
tracing = ["langsmith>=0.8.18"]
# The counter kit on a Raspberry Pi (docs/kit.md). Without it, safepay-kit
# runs with the keyboard as the buttons.
kit = ["gpiozero>=2.0"]

[project.scripts]
safepay = "safepay.cli:main"
safepay-mcp-proxy = "safepay.mcp_proxy:main"
safepay-kit = "safepay.kit:main"

[project.urls]
Homepage = "https://github.com/NovaCorpAI/safepay"
Demo = "https://safepay.agentposhq.com"

[tool.setuptools]
packages = ["safepay"]

[tool.setuptools.package-data]
safepay = ["data/*.json"]
